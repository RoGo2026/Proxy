<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTProto Proxies</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 15px;
            max-width: 800px;
            margin: 0 auto;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h2 {
            margin: 0;
            color: #333;
            font-size: 20px;
        }
        .counter {
            background-color: #2e7d32; /* Сделали зеленым, раз они рабочие */
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .proxy-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .proxy-link {
            display: block;
            flex: 1 1 calc(33.333% - 10px);
            min-width: 140px;
            background-color: #0088cc;
            color: white;
            padding: 12px 8px;
            text-decoration: none;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            box-sizing: border-box;
            transition: background-color 0.2s;
            /* Добавили flex, чтобы красиво разместить текст и пинг */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .ping-text {
            font-size: 11px;
            opacity: 0.8;
            margin-top: 4px;
        }
        .proxy-link:active {
            background-color: #006699;
        }
        .proxy-link.clicked {
            background-color: #d9534f;
        }
        @media (max-width: 600px) {
            .proxy-link {
                flex: 1 1 calc(50% - 10px);
            }
        }
        @media (max-width: 360px) {
            .proxy-link {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>MTProto Прокси</h2>
        <div class="counter">Работает: 0</div>
    </div>

    <div class="proxy-grid">
    </div>

    <script>
        document.querySelectorAll('.proxy-link').forEach(button => {
            button.addEventListener('click', function() {
                this.classList.add('clicked');
            });
        });
    </script>
</body>
</html>
