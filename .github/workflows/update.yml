name: Update Proxies Site

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('proxy_parser.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install requests
      run: pip install requests

    - name: Run proxy parser
      run: python proxy_parser.py

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html proxies.txt all_proxies.txt
        git commit -m "Auto update proxies [skip ci]" || echo "No changes"
        git push
