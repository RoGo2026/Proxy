name: Auto Proxy Parser and Deploy

on:
 workflow_dispatch: # Оставляем кнопку ручного запуска

permissions:
  contents: write # Даем экшену права на запись, чтобы он мог пушить обновленный сайт

jobs:
  build-and-parse:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Proxy Parser
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python proxy_parser.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Добавляем измененные скриптом файлы в индекс Git
          git add proxies.txt index.html users.txt
          
          # Делаем коммит и пуш только если файлы реально изменились
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Свежие элитные прокси и сайт" && git push)
