name: Auto Proxy Parser and Deploy

on:
 workflow_dispatch: # Оставляем кнопку ручного запуска

permissions:
  contents: write # Даем экшену права на запись, чтобы он мог пушить обновленный сайт

jobs:
  build-and-parse:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Python dependencies
        id: pip-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-venv-${{ hashFiles('requirements.txt') }}

      - name: Create venv and Install Dependencies
        if: steps.pip-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Run Proxy Parser
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TELETHON_SESSION: ${{ secrets.TELETHON_SESSION }}
          TELETHON_CHANNEL: ${{ secrets.TELETHON_CHANNEL }}
          TELETHON_TOPIC_ID: ${{ secrets.TELETHON_TOPIC_ID }}
          TELETHON_USERS: ${{ secrets.TELETHON_USERS }}
        run: .venv/bin/python proxy_parser.py

      - name: Update Users Secret
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: .venv/bin/python update_secret.py

      - name: Update Proxies Secret
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: .venv/bin/python update_proxies.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Добавляем измененный скриптом файл сайта в индекс Git
          git add index.html
          
          # Делаем коммит и пуш только если файлы реально изменились
          git diff --quiet && git diff --staged --quiet || (          git commit -m "Auto-update: Свежие прокси и сайт" && git push)
