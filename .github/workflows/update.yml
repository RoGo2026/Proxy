name: Update Proxies Site

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Копируем репозиторий
      uses: actions/checkout@v4

    - name: Настраиваем Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Восстанавливаем кэш pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('proxy_parser.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Устанавливаем библиотеку для запросов
      run: pip install requests

    - name: Запуск сбора прокси и обновления сайта
      run: python proxy_parser.py

    - name: Сохранение изменений в GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html proxies.txt
        git commit -m "Автоматическое обновление прокси и сайта [skip ci]" || echo "Нет изменений для коммита"
        git push
