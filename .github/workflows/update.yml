name: Update Proxies Site

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Копируем репозиторий
      uses: actions/checkout@v4

    - name: Установка системных зависимостей для TDLib
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake gperf libssl-dev zlib1g-dev

    - name: Настраиваем Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Устанавливаем библиотеку requests
      run: pip install requests

    - name: Шаг 1 - Сбор всех прокси (Python)
      run: python proxy_parser.py

    - name: Настраиваем Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Устанавливаем пакет проверки прокси
      run: npm install telegram-mtproto-proxy-checker

    - name: Шаг 2 - Проверка прокси через TDLib и генерация HTML
      run: node checker.js

    - name: Сохранение изменений в GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html proxies.txt all_proxies.txt
        git commit -m "Автоматическое обновление прокси и сайта [skip ci]" || echo "Нет изменений для коммита"
        git push
