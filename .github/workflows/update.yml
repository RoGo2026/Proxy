name: Update Proxies Site

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requirements
        run: pip install requests

      - name: Run script
        env:
          # Передаем токен из секретов гитхаба в скрипт
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python proxy_parser.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git add proxies.txt
          git add users.txt || echo "No users file yet"
          git commit -m "Auto-update and send proxies [skip ci]" || echo "No changes to commit"
          git push
