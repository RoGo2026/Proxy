name: Create Telethon Session

on: workflow_dispatch

jobs:
  create-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install telethon
        run: pip install telethon
      - name: Create session
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python - <<EOF
          import asyncio
          import os
          from telethon import TelegramClient
          
          api_id = int(os.environ['API_ID'])
          api_hash = os.environ['API_HASH']
          
          async def main():
              async with TelegramClient('my_session', api_id, api_hash) as client:
                  await client.start()
                  print("Session created successfully")
          
          asyncio.run(main())
          EOF
      - name: Upload session as artifact
        uses: actions/upload-artifact@v4
        with:
          name: session
          path: my_session.session
      - name: Commit session to repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add my_session.session
          git commit -m "Add session file [skip ci]" || echo "No changes"
          git push
