name: Cleanup GitHub Pages Deployments

on:
  workflow_dispatch:  # Запуск вручную
  schedule:
     - cron: '0 */20 * * *'
       timezone: "Europe/Moscow"

permissions:
  deployments: write   # Чтобы можно было удалять деплойменты
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const { data: latest } = await github.rest.repos.listDeployments({
              owner, repo, environment: 'github-pages', per_page: 1
            });

            if (latest.length === 0) {
              console.log('Деплойментов нет.');
              return;
            }

            // Самый свежий деплоймент — активный, его не трогаем
            const activeId = latest[0].id;

            let page = 1;
            let deleted = 0;
            let total = 0;

            while (true) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner, repo, environment: 'github-pages', per_page: 100, page
              });

              if (deployments.length === 0) break;
              total += deployments.length;

              for (const dep of deployments) {
                if (dep.id === activeId) continue;
                try {
                  await github.rest.repos.deleteDeployment({
                    owner, repo, deployment_id: dep.id
                  });
                  deleted++;
                } catch (err) {
                  core.info(`Пропускаю #${dep.id} (${dep.created_at}): ${err.status}`);
                }
              }

              if (deployments.length < 100) break;
              page++;
            }

            console.log(`Всего деплойментов: ${total}, удалено: ${deleted}`);
